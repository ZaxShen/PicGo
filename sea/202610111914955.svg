<svg xmlns="http://www.w3.org/2000/svg" width="680" height="800" viewBox="0 0 680 800" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"><title>One training step</title><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="680" height="800" fill="#FFFFFF"/><text x="340" y="40" text-anchor="middle" font-size="20" font-weight="600" fill="#2C2C2A">One training step</text><text x="340" y="64" text-anchor="middle" font-size="13" fill="#5F5E5A">forward → loss → backward → update</text><rect x="60" y="110" width="230" height="52" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/><text x="175.0" y="128" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#444441">X  (5, 2)</text><text x="175.0" y="146" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">input data, forward starts</text><rect x="390" y="110" width="230" height="52" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/><text x="505.0" y="128" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#444441">dX  (5, 2)</text><text x="505.0" y="146" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">returned, unused in training</text><rect x="44" y="170" width="592" height="430" rx="16" fill="none" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="5 4"/><text x="340" y="185" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Sequential: forward loops down, backward loops up</text><rect x="60" y="200" width="230" height="52" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="175.0" y="218" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#3C3489">Linear #1 .forward</text><text x="175.0" y="236" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">X (5,2) → Z1 (5,8)</text><rect x="390" y="200" width="230" height="52" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="505.0" y="218" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#3C3489">Linear #1 .backward</text><text x="505.0" y="236" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">dZ1 → dX, stores dW, db</text><line x1="292" y1="226" x2="386" y2="226" stroke="#73726c" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#a)"/><text x="339" y="214" text-anchor="middle" font-size="12" fill="#5F5E5A">cache X</text><rect x="60" y="282" width="230" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="175.0" y="300" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#085041">ReLU #1 .forward</text><text x="175.0" y="318" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">Z1 → A1 (5,8)</text><rect x="390" y="282" width="230" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="505.0" y="300" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#085041">ReLU #1 .backward</text><text x="505.0" y="318" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">dA1 → dZ1 (5,8)</text><line x1="292" y1="308" x2="386" y2="308" stroke="#73726c" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#a)"/><text x="339" y="296" text-anchor="middle" font-size="12" fill="#5F5E5A">cache Z1</text><rect x="60" y="364" width="230" height="52" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="175.0" y="382" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#3C3489">Linear #2 .forward</text><text x="175.0" y="400" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">A1 (5,8) → Z2 (5,4)</text><rect x="390" y="364" width="230" height="52" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="505.0" y="382" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#3C3489">Linear #2 .backward</text><text x="505.0" y="400" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">dZ2 → dA1, stores dW, db</text><line x1="292" y1="390" x2="386" y2="390" stroke="#73726c" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#a)"/><text x="339" y="378" text-anchor="middle" font-size="12" fill="#5F5E5A">cache A1</text><rect x="60" y="446" width="230" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="175.0" y="464" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#085041">ReLU #2 .forward</text><text x="175.0" y="482" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">Z2 → A2 (5,4)</text><rect x="390" y="446" width="230" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="505.0" y="464" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#085041">ReLU #2 .backward</text><text x="505.0" y="482" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">dA2 → dZ2 (5,4)</text><line x1="292" y1="472" x2="386" y2="472" stroke="#73726c" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#a)"/><text x="339" y="460" text-anchor="middle" font-size="12" fill="#5F5E5A">cache Z2</text><rect x="60" y="528" width="230" height="52" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="175.0" y="546" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#3C3489">Linear #3 .forward</text><text x="175.0" y="564" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">A2 (5,4) → logits (5,3)</text><rect x="390" y="528" width="230" height="52" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="505.0" y="546" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#3C3489">Linear #3 .backward</text><text x="505.0" y="564" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">dlogits → dA2, stores dW, db</text><line x1="292" y1="554" x2="386" y2="554" stroke="#73726c" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#a)"/><text x="339" y="542" text-anchor="middle" font-size="12" fill="#5F5E5A">cache A2</text><rect x="60" y="630" width="560" height="52" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/><text x="340.0" y="648" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#444441">softmax_crossentropy(logits, y)</text><text x="340.0" y="666" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">→ loss (for printing), dlogits (5,3) starts backward</text><rect x="60" y="710" width="560" height="52" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/><text x="340.0" y="728" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#444441">model.step(lr)</text><text x="340.0" y="746" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">p -= lr * g  for every (p, g) in model.params()</text><line x1="175" y1="162" x2="175" y2="198" stroke="#73726c" stroke-width="1.2" marker-end="url(#a)"/><line x1="175" y1="252" x2="175" y2="280" stroke="#73726c" stroke-width="1.2" marker-end="url(#a)"/><line x1="175" y1="334" x2="175" y2="362" stroke="#73726c" stroke-width="1.2" marker-end="url(#a)"/><line x1="175" y1="416" x2="175" y2="444" stroke="#73726c" stroke-width="1.2" marker-end="url(#a)"/><line x1="175" y1="498" x2="175" y2="526" stroke="#73726c" stroke-width="1.2" marker-end="url(#a)"/><line x1="175" y1="580" x2="175" y2="628" stroke="#73726c" stroke-width="1.2" marker-end="url(#a)"/><line x1="505" y1="630" x2="505" y2="582" stroke="#73726c" stroke-width="1.2" marker-end="url(#a)"/><line x1="505" y1="528" x2="505" y2="500" stroke="#73726c" stroke-width="1.2" marker-end="url(#a)"/><line x1="505" y1="446" x2="505" y2="418" stroke="#73726c" stroke-width="1.2" marker-end="url(#a)"/><line x1="505" y1="364" x2="505" y2="336" stroke="#73726c" stroke-width="1.2" marker-end="url(#a)"/><line x1="505" y1="282" x2="505" y2="254" stroke="#73726c" stroke-width="1.2" marker-end="url(#a)"/><line x1="505" y1="200" x2="505" y2="164" stroke="#73726c" stroke-width="1.2" marker-end="url(#a)"/><path d="M620 226 L652 226 L652 736 L624 736" fill="none" stroke="#73726c" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#a)"/><line x1="620" y1="390" x2="652" y2="390" stroke="#73726c" stroke-width="1" stroke-dasharray="4 3"/><line x1="620" y1="554" x2="652" y2="554" stroke="#73726c" stroke-width="1" stroke-dasharray="4 3"/></svg>